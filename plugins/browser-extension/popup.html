<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ACMer Analyze Bridge</title>
    <style>
      body { font-family: sans-serif; min-width: 320px; padding: 12px; }
      label { display: block; margin: 8px 0 4px; font-size: 12px; color: #555; }
      input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; }
      button { width: 100%; padding: 10px; margin-bottom: 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
      button:hover { background: #1557b0; }
      .status-box { background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 20px; }
      .status-box.success { background: #e8f5e9; }
      .status-box.error { background: #ffebee; }
      a { color: #1a73e8; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .links { margin-top: 8px; }
      .links div { margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <label for="target-team">目标队伍</label>
    <input id="target-team" type="text" value="tourist" placeholder="输入队伍名称" />
    <button id="send-current-page">发送并开始分析</button>
    <div class="status-box" id="status">等待操作</div>
    <div class="links" id="links"></div>
    <script src="popup.js"></script>
  </body>
</html>
