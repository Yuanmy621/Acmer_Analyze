<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ACMer Analyze Bridge</title>
    <style>
      body { font-family: sans-serif; min-width: 360px; padding: 12px; }
      label { display: block; margin: 8px 0 4px; font-size: 12px; color: #555; }
      input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; }
      button { width: 100%; padding: 8px; margin-bottom: 8px; }
      pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 8px; border-radius: 6px; max-height: 200px; overflow: auto; }
      .summary { background: #eef6ff; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
      .summary div { margin-bottom: 6px; }
      code { background: #f0f0f0; padding: 1px 4px; border-radius: 4px; }
      a { color: #1a73e8; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <label for="target-team">目标队伍</label>
    <input id="target-team" type="text" value="tourist" />
    <label for="aliases">别名（逗号分隔）</label>
    <input id="aliases" type="text" value="tourist" />
    <button id="send-current-page">发送并开始分析</button>
    <div class="summary" id="result-summary">
      <div>状态：等待操作</div>
      <div>run_id：-</div>
      <div>report：-</div>
      <div>validation：-</div>
    </div>
    <pre id="status">等待操作</pre>
    <script src="popup.js"></script>
  </body>
</html>
